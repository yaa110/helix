name: Release

# Tag-only release workflow. Create and push a tag such as `v0.1.0`:
#   git tag v0.1.0
#   git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grammars:
    name: Fetch tree-sitter grammars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - name: Fetch grammar sources
        run: cargo run --package=helix-loader --bin=hx-loader
      - name: Bundle grammar sources
        run: tar cJf grammars.tar.xz -C runtime/grammars/sources .
      - uses: actions/upload-artifact@v4
        with:
          name: grammars
          path: grammars.tar.xz

  build:
    name: Build ${{ matrix.target }}
    needs: grammars
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: grammars

      - name: Unpack grammar sources
        run: |
          mkdir -p runtime/grammars/sources
          tar xJf grammars.tar.xz -C runtime/grammars/sources

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --profile opt --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/stage" "dist/out"
          cp "target/${{ matrix.target }}/opt/hx" dist/stage/hx
          cp README.md LICENSE dist/stage/
          cp -R runtime dist/stage/runtime
          rm -rf dist/stage/runtime/grammars/sources
          tar -czf "dist/hx-${{ matrix.target }}.tar.gz" -C dist/stage .
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "hx-${{ matrix.target }}.tar.gz" > "hx-${{ matrix.target }}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "hx-${{ matrix.target }}.tar.gz" > "hx-${{ matrix.target }}.tar.gz.sha256")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hx-${{ matrix.target }}
          path: |
            dist/hx-${{ matrix.target }}.tar.gz
            dist/hx-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
