# Author : WindSoilder<WindSoilder@outlook.com>
# The unofficial Monokai Pro theme, simply migrate from jetbrains monokai pro theme: https://github.com/subtheme-dev/monokai-pro
# Credit goes to the original creator: https://monokai.pro

"ui.text.focus" = { fg = "yellow", modifiers= ["bold"] }
"ui.virtual.whitespace" = "base4"
"ui.virtual.ruler" = { bg = "base1" }
"ui.virtual.jump-label" = { fg = "red", modifiers = ["bold"] }

"info" = "base8"
"hint" = "base8"

# background color
"ui.background" = { bg = "base2" }

# status bars, panels, modals, autocompletion

# active line, highlighting

# bufferline, inlay hints
"ui.virtual.inlay-hint" = { fg = "base6" }

# comments, nord3 based lighter color
"comment" = { fg = "base5", modifiers = ["italic"] }

# cursor, variables, constants, attributes, fields
"ui.cursor.primary" = { fg = "base7", modifiers = ["reversed"] }
"attribute" = "blue"
"variable"  = "base8"
"constant"  = "orange"
"variable.builtin" = "red"
"constant.builtin" = "red"
"namespace" = "base8"

# base text, punctuation
"ui.text" = { fg = "base8" }
"punctuation" = "base6"

# classes, types, primitives
"type" = "green"
"type.builtin" = { fg = "red"}
"label" = "base8"

# declaration, methods, routines
"constructor" = "blue"
"function" = "green"
"function.macro" = { fg = "blue" }
"function.builtin" = { fg = "blue" }

# operator, tags, units, punctuations
"operator" = "red"
"variable.other.member" = "base8"

# keywords, special
"keyword" = { fg = "red" }
"keyword.directive" = "blue"
"variable.parameter" = "#f59762"

# error
"error" = { fg = "red", modifiers = ["bold"] }

# annotations, decorators
"special" = "#f59762"
"module" = "#f59762"

# warnings, escape characters, regex
"warning" = { fg = "#fd9353" }
"constant.character.escape" = { fg = "base8" }

# strings
"string" = "yellow"

# integer, floating point
"constant.numeric" = "purple"

# vcs
"diff.plus" = "green"
"diff.delta" = "orange"
"diff.minus" = "red"

# make diagnostic underlined, to distinguish with selection text.
"diagnostic.warning" = { underline = { color = "orange", style = "curl" } }
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.info" = { underline = { color = "base8", style = "curl" } }
"diagnostic.hint" = { underline = { color = "base8", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

# markup highlight, no need for `markup.raw` and `markup.list`, make them to be default
"markup.heading" = "green"
"markup.bold" = { fg = "orange", modifiers = ["bold"] }
"markup.italic" = { fg = "orange", modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "orange", modifiers = ["underlined"] }
"markup.link.text" = "yellow"
"markup.quote" = "green"

[palette]
# primary colors
"red" = "#fc618d"
"orange" = "#fd9353"
"yellow" = "#fce566"
"green" = "#7bd88f"
"blue" = "#5ad4e6"
"purple" = "#948ae3"
# base colors
"base0" = "#131313"
"base1" = "#191919"
"base2" = "#222222"
"base3" = "#363537"
"base4" = "#525053"
"base5" = "#69676c"
"base6" = "#8b888f"
"base7" = "#bab6c0"
"base8" = "#f7f1ff"
# variants
"base8x0c" = "#2b2b2b"

# VSCode "Monokai Pro (Filter Spectrum)" UI mappings.
# Sidebar/explorer
"ui.sidebar" = { bg = "base1" }
"ui.sidebar.border" = { fg = "base0" }
"ui.sidebar.title" = { fg = "base7", modifiers = ["bold"] }
"ui.tree.directory" = { fg = "blue" }
"ui.tree.selected" = { bg = "base3" }

# VSCode status bar and widgets
"ui.statusline" = { fg = "base5", bg = "base1" }
"ui.statusline.inactive" = { fg = "base5", bg = "base1" }
"ui.statusline.normal" = { fg = "base1", bg = "blue" }
"ui.statusline.insert" = { fg = "base1", bg = "green" }
"ui.statusline.select" = { fg = "base1", bg = "purple" }
"ui.popup" = { bg = "base3" }
"ui.window" = { bg = "base3" }
"ui.help" = { fg = "base7", bg = "base3" }
"ui.menu" = { fg = "base8", bg = "base2" }
"ui.menu.selected" = { fg = "base2", bg = "yellow" }
"ui.bufferline" = { fg = "base5", bg = "base1" }
"ui.bufferline.active" = { fg = "base8", bg = "base3" }
"ui.linenr" = { fg = "base4" }
"ui.linenr.selected" = { fg = "base7", bg = "base3" }
"ui.selection" = { bg = "base3" }
"ui.cursor.match" = { bg = "base3" }
"ui.cursorline" = { bg = "base1" }
