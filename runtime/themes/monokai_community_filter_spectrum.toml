# Monokai Community (Filter Spectrum) for Helix.
# Token colors mirror VSCode's Monokai theme extension.
# UI colors below are adapted to Helix's sidebar/statusline widgets.

"ui.text.focus" = { fg = "yellow", modifiers= ["bold"] }
"ui.virtual.whitespace" = "base4"
"ui.virtual.indent-guide" = { fg = "base4", modifiers = ["dim"] }
"ui.virtual.ruler" = { bg = "base1" }
"ui.virtual.jump-label" = { fg = "red", modifiers = ["bold"] }

"info" = "base8"
"hint" = "base8"

# background color
"ui.background" = { bg = "base2" }

# status bars, panels, modals, autocompletion

# active line, highlighting

# bufferline, inlay hints
"ui.virtual.inlay-hint" = { fg = "base6" }

# comments
"comment" = { fg = "base5", modifiers = ["italic"] }

# cursor, variables, constants, attributes, fields
"ui.cursor.primary" = { fg = "base7", modifiers = ["reversed"] }
"attribute" = { fg = "blue", modifiers = ["italic"] }
"variable" = "base8"
"constant" = "purple"
"variable.builtin" = { fg = "base7", modifiers = ["italic"] }
"constant.builtin" = "purple"
"namespace" = "blue"

# base text, punctuation
"ui.text" = { fg = "base8" }
"punctuation" = "base6"
"punctuation.bracket" = "base6"
"punctuation.delimiter" = "base6"
"punctuation.special" = "base6"

# classes, types, primitives
"type" = "blue"
"type.builtin" = { fg = "blue", modifiers = ["italic"] }
# `label` is used for Markdown code-fence info strings in Helix, which VSCode
# leaves at the default text color.
"label" = "base8"

# declaration, methods, routines
"constructor" = "blue"
"function" = "green"
"function.macro" = { fg = "green" }
"function.builtin" = { fg = "green" }

# operator, tags, units, punctuations
"operator" = "red"
"variable.other.member" = "base8"
"property" = "base8"
"tag" = "red"

# keywords, special
"keyword" = { fg = "red" }
"keyword.directive" = { fg = "red" }
"variable.parameter" = { fg = "orange", modifiers = ["italic"] }

# error
"error" = { fg = "red", modifiers = ["bold"] }

# annotations, decorators
"special" = "orange"
"module" = "blue"

# warnings, escape characters, regex
"warning" = { fg = "orange" }
"constant.character" = "yellow"
"constant.character.escape" = "purple"
"string.escape" = "purple"
"string.regexp" = "yellow"

# strings
"string" = "yellow"

# integer, floating point
"constant.numeric" = "purple"

# vcs
"diff.plus" = "green"
"diff.delta" = "orange"
"diff.minus" = "red"

# make diagnostic underlined, to distinguish with selection text.
"diagnostic.warning" = { underline = { color = "orange", style = "curl" } }
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.info" = { underline = { color = "base8", style = "curl" } }
"diagnostic.hint" = { underline = { color = "base8", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

# Markdown and other markup, matching the VSCode Monokai theme:
# headings yellow, bold/italic inherit the base text color, inline/block raw
# orange, link URLs green+underlined, link titles pink, quotes italic.
"markup.heading" = "yellow"
"markup.heading.marker" = "base6"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.underline" = { modifiers = ["underlined"] }
"markup.raw" = "orange"
"markup.raw.inline" = "orange"
"markup.raw.block" = "orange"
"markup.link" = { fg = "green", modifiers = ["underlined"] }
"markup.link.url" = { fg = "green", modifiers = ["underlined"] }
"markup.link.text" = "red"
"markup.link.label" = "red"
"markup.quote" = { modifiers = ["italic"] }
"markup.list.unnumbered" = "base6"
"markup.list.numbered" = "base6"
"markup.list.checked" = "green"
"markup.list.unchecked" = "base6"
"markup.inserted" = "green"
"markup.deleted" = "red"
"markup.changed" = "yellow"
"markup.ignored" = "base6"
"markup.untracked" = "base6"

# VSCode Monokai UI mappings.
# Sidebar/explorer
"ui.sidebar" = { bg = "#252526" }
"ui.sidebar.border" = { fg = "base0" }
"ui.sidebar.title" = { fg = "base7", modifiers = ["bold"] }
"ui.tree.header" = { fg = "base7", bg = "base2", modifiers = ["bold"] }
"ui.tree.ignored" = { fg = "base4" }
"ui.tree.directory" = { fg = "blue" }
"ui.tree.selected" = { bg = "base3" }

# VSCode status bar and widgets
"ui.statusline" = { fg = "base5", bg = "base1" }
"ui.statusline.inactive" = { fg = "base5", bg = "base1" }
"ui.statusline.normal" = { fg = "base1", bg = "blue" }
"ui.statusline.insert" = { fg = "base1", bg = "green" }
"ui.statusline.select" = { fg = "base1", bg = "purple" }
"ui.popup" = { bg = "base3" }
"ui.window" = { bg = "base3" }
"ui.help" = { fg = "base7", bg = "base3" }
"ui.menu" = { fg = "base8", bg = "base2" }
"ui.menu.selected" = { fg = "base2", bg = "yellow" }
"ui.breadcrumbs" = { fg = "#7dcfff" }
"ui.breadcrumbs.current" = { fg = "#a6e3ff" }
"ui.bufferline.background" = { bg = "base0" }
"ui.bufferline" = { fg = "base5", bg = "base0" }
"ui.bufferline.active" = { fg = "base8", bg = "base2" }
"ui.linenr" = { fg = "base4" }
"ui.linenr.selected" = { fg = "base7", bg = "base3" }
"ui.selection" = { bg = "base3" }
"ui.cursor.match" = { bg = "base3" }
"ui.cursorline" = { bg = "base1" }

[palette]
# primary colors
"red" = "#fc618d"
"orange" = "#fd9353"
"yellow" = "#fce566"
"green" = "#7bd88f"
"blue" = "#5ad4e6"
"purple" = "#948ae3"
# base colors
"base0" = "#131313"
"base1" = "#191919"
"base2" = "#222222"
"base3" = "#363537"
"base4" = "#525053"
"base5" = "#69676c"
"base6" = "#8b888f"
"base7" = "#bab6c0"
"base8" = "#f7f1ff"
# variants
"base8x0c" = "#2b2b2b"
